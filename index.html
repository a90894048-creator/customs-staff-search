<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관세청 직원 검색</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231d6fe0' stroke-width='2.6' stroke-linecap='round'%3E%3Ccircle cx='10.5' cy='10.5' r='6.5'/%3E%3Cpath d='M15.5 15.5 21 21'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f4f6f9; --surface: #fff; --surface-2: #f8fafc; --border: #e2e7ee; --text: #1b2430; --muted: #66727f;
  --accent: #1d6fe0; --accent-soft: #e7f0fd; --mark: #fff1a8; --tag-p: #e6f4ea; --tag-p-t: #1e7a3a; --tag-d: #eef0f4; --tag-d-t: #4f5b68;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12161c; --surface: #1a2028; --surface-2: #202833; --border: #2d3743; --text: #e5eaf0; --muted: #94a0ad;
    --accent: #5b9cf5; --accent-soft: #1c2d45; --mark: #5c4d0f; --tag-p: #173523; --tag-p-t: #7fd39a; --tag-d: #262e39; --tag-d-t: #a9b4c0;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 28px 16px 60px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
h1 { margin: 0; font-size: 24px; letter-spacing: -0.5px; }
.updated { color: var(--muted); font-size: 13px; }
.search { position: relative; }
.search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); }
#q { width: 100%; padding: 15px 16px 15px 48px; font: inherit; font-size: 17px; color: var(--text); background: var(--surface);
  border: 1.5px solid var(--border); border-radius: 12px; outline: none; }
#q:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.hint { color: var(--muted); font-size: 13px; margin: 8px 2px 14px; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 3px; }
.seg button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
.seg button.on { background: var(--accent); color: #fff; }
select { font: inherit; font-size: 14px; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 7px 10px; }
.count { margin-left: auto; color: var(--muted); font-size: 14px; }
.count b { color: var(--text); }
.table { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; font-size: 14px; }
thead th { background: var(--surface-2); font-size: 13px; color: var(--muted); font-weight: 600; white-space: nowrap; }
thead tr.filters th { padding: 6px 8px; }
thead input { width: 100%; font: inherit; font-size: 13px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); }
tbody tr:hover { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: 0; }
td.name { font-weight: 600; white-space: nowrap; }
td.phone { white-space: nowrap; font-variant-numeric: tabular-nums; }
td.phone a { color: var(--accent); text-decoration: none; }
td.phone .guess { color: var(--muted); font-size: 11px; margin-left: 3px; vertical-align: 2px; cursor: help; }
td.name .src { font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 3px; padding: 1px 5px; margin-left: 5px; vertical-align: 1px; cursor: help; }
td.name .src.old { color: var(--muted); background: var(--tag-d); }
.subjob { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
td.agency, td.pos { white-space: nowrap; }
.tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; margin-right: 4px; vertical-align: 1px; font-weight: 600; }
.tag.d { background: var(--tag-d); color: var(--tag-d-t); }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
.empty { padding: 48px 16px; text-align: center; color: var(--muted); }
.more { display: block; margin: 14px auto 0; font: inherit; font-size: 14px; padding: 9px 22px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
footer { margin-top: 24px; color: var(--muted); font-size: 12px; line-height: 1.7; }
footer a { color: var(--muted); }
@media (max-width: 760px) {
  .wrap { padding-top: 18px; }
  h1 { font-size: 20px; }
  .count { margin-left: 0; width: 100%; }
  thead { display: none; }
  table, tbody, tr, td { display: block; }
  tbody tr { padding: 10px 14px; border-bottom: 1px solid var(--border); }
  td { border: 0; padding: 1px 0; }
  td.agency { color: var(--muted); font-size: 12px; }
  td.name { display: inline; font-size: 16px; } td.pos { display: inline; margin-left: 6px; color: var(--muted); }
  td.dept { font-size: 13px; }
  td.phone { margin-top: 4px; }
  td:empty { display: none; }
}

</head>
<body>
<div class="wrap">
  <header>
    <h1>관세청 직원 검색</h1>
    <span class="updated" id="updated">데이터 불러오는 중…</span>
  </header>

  <div class="search">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
    <input id="q" type="search" placeholder="이름, 업무, 부서, 전화번호로 검색 (예: 홍길동, 원산지, 수입통관)" autocomplete="off" autofocus>
  </div>
  <div class="hint">띄어쓰기로 여러 단어를 입력하면 모두 포함된 결과만 보여줍니다. 예: <b>인천 원산지</b></div>

  <div class="controls">
    <div class="seg" id="type">
      <button data-v="all" class="on">전체</button>
      <button data-v="p">직원</button>
      <button data-v="d">부서·업무</button>
    </div>
    <select id="agency"><option value="">전체 기관</option></select>
    <span class="count" id="count"></span>
  </div>

  <div class="table">
    <table>
      <thead>
        <tr><th>소속기관</th><th>부서</th><th>직위</th><th>성명</th><th>주요업무</th><th>전화번호</th></tr>
        <tr class="filters">
          <th><input data-c="1" placeholder="필터"></th><th><input data-c="2" placeholder="필터"></th>
          <th><input data-c="3" placeholder="필터"></th><th><input data-c="4" placeholder="필터"></th>
          <th><input data-c="5" placeholder="필터"></th><th><input data-c="6" placeholder="필터"></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden></div>
  </div>
  <button class="more" id="more" hidden>더 보기</button>

  <footer>
    출처: <a href="https://www.customs.go.kr/kcs/ad/de/selectEmpName.do?mi=2956" target="_blank" rel="noopener">관세청 홈페이지 업무안내(직원 검색)</a>에 공개된 정보를 매일 자동으로 모은 것입니다.
    인사이동이 바로 반영되지 않을 수 있으니, 정확한 정보는 관세청 홈페이지에서 확인하세요.
    <br>관세청 자료에 성명이 없는 일부 부서는 현장에서 확인한 내용으로 보강했습니다. 보강한 값에는 <b>직접입력</b> 표시가 붙고, 마우스를 올리면 출처와 확인일이 나옵니다.
  </footer>
</div>

<script>
const PAGE = 200;
const state = { rows: [], type: 'all', agency: '', q: [], filters: {}, shown: PAGE, list: [] };
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = s => s.toLowerCase().replace(/[\s-]/g, '');

// ── HTML 실체 복원 ────────────────────────────────────────────────
// 관세청 원본에 &amp;middot; 처럼 이중 인코딩된 값이 섞여 있어, 수집기가 한 번 풀어도
// &middot; 가 글자 그대로 남는다. 더 이상 바뀌지 않을 때까지(최대 3회) 다시 해석한다.
const ENTITIES = {
  nbsp: ' ', amp: '&', lt: '<', gt: '>', quot: '"', apos: "'", middot: '\u00b7', sdot: '\u22c5', bull: '\u2022',
  hellip: '\u2026', ndash: '\u2013', mdash: '\u2014', lsquo: '\u2018', rsquo: '\u2019', ldquo: '\u201c', rdquo: '\u201d',
  laquo: '\u00ab', raquo: '\u00bb', deg: '\u00b0', times: '\u00d7', divide: '\u00f7', plusmn: '\u00b1', sim: '\u223c',
  copy: '\u00a9', reg: '\u00ae', trade: '\u2122', sect: '\u00a7', para: '\u00b6', prime: '\u2032', Prime: '\u2033',
  frac12: '\u00bd', permil: '\u2030', ensp: ' ', emsp: ' ', thinsp: ' ', shy: '',
};
// 세미콜론으로 제대로 끝나는 실체만 해석한다 (업무명의 `R&D` 같은 평문은 그대로 둔다).
function unent(s) {
  let out = String(s == null ? '' : s), prev;
  for (let i = 0; i < 3 && out !== prev; i++) {
    prev = out;
    out = out.replace(/&(#\d{1,7}|#x[0-9a-f]{1,6}|[a-z][a-z0-9]{1,9});/gi, (m, g) => {
      if (g[0] === '#') {
        const n = g[1] === 'x' || g[1] === 'X' ? parseInt(g.slice(2), 16) : parseInt(g.slice(1), 10);
        return Number.isFinite(n) && n > 0 && n <= 0x10ffff ? String.fromCodePoint(n) : m;
      }
      const v = ENTITIES[g] !== undefined ? ENTITIES[g] : ENTITIES[g.toLowerCase()];
      return v === undefined ? m : v;
    });
  }
  return out;
}

// ── 전화번호 정리 ─────────────────────────────────────────────────
// 원본에 042-481-7601 / 0424817671 / 4817602 / (051)620-6290 / 063-73-08715 처럼
// 표기가 뒤섞여 있다. 맨 앞 번호만 표준 형식으로 바꾸고, 뒤에 붙은 내선·범위 표기
// (", 6794", "~5/4747", "(입국)")는 원본 그대로 남긴다. 없는 자리(--, ., 0)는 비운다.
function formatPhone(raw) {
  let s = String(raw == null ? '' : raw).trim();
  if (!s) return '';
  // (051)620-6290, 032)452-3267 → 051-620-6290
  s = s.replace(/^\(?\s*(\d{2,4})\s*\)\s*-?\s*/, '$1-');
  const head = (s.match(/^\d[\d\s-]*/) || [''])[0].trim().replace(/-+$/, '');
  if (!head) return '';
  const rest = s.slice(s.indexOf(head) + head.length);
  const d = head.replace(/\D/g, '');
  let out = head;
  if (d.length < 7) return rest.trim() ? rest.trim() : '';   // "0", "." 등 번호가 아닌 값
  else if (d.length === 7) out = d.replace(/^(\d{3})(\d{4})$/, '$1-$2');          // 국번 없는 7자리
  else if (d.length === 8) out = d.replace(/^(\d{4})(\d{4})$/, '$1-$2');          // 국번 없는 8자리
  else if (d.length === 9 && d.startsWith('02')) out = d.replace(/^(02)(\d{3})(\d{4})$/, '$1-$2-$3');
  else if (d.length === 10 && d.startsWith('02')) out = d.replace(/^(02)(\d{4})(\d{4})$/, '$1-$2-$3');
  else if (d.length === 10) out = d.replace(/^(\d{3})(\d{3})(\d{4})$/, '$1-$2-$3');
  else if (d.length === 11) out = d.replace(/^(\d{3})(\d{4})(\d{4})$/, '$1-$2-$3');
  // 그 밖의 길이는 원본 표기를 그대로 둔다
  return (out + rest).trim();
}

// 걸 수 있는 번호(지역번호 포함 9자리 이상)일 때만 tel: 링크를 만든다.
function telOf(shown) {
  const head = (String(shown).match(/^\d[\d-]*/) || [''])[0].replace(/\D/g, '');
  return head.length >= 9 && head.startsWith('0') ? head : '';
}

// ── 빠진 지역번호 보완 ────────────────────────────────────────────
// 원본에 "481-7602" 처럼 지역번호 없이 적힌 번호가 있다. 같은 기관의 다른 번호에서
// 같은 국번(481)이 쓰인 지역번호를 찾아, 후보가 **하나로만** 모일 때에 한해 채운다.
// 근거가 없거나 둘 이상으로 갈리면 손대지 않는다. 채운 번호는 r._guess 로 표시해
// 화면에서 추정값임을 알린다.
function fillAreaCodes(rows) {
  const byOrg = new Map();                       // 기관 → (국번 → 지역번호 집합)
  for (const r of rows) {
    const m = String(r[6]).match(/^(0\d{1,2})-(\d{3,4})-\d{4}/);
    if (!m) continue;
    if (!byOrg.has(r[1])) byOrg.set(r[1], new Map());
    const pre = byOrg.get(r[1]);
    if (!pre.has(m[2])) pre.set(m[2], new Set());
    pre.get(m[2]).add(m[1]);
  }
  let filled = 0;
  for (const r of rows) {
    const m = String(r[6]).match(/^(\d{3,4})-(\d{4})(?![\d-])(.*)$/);   // 지역번호가 없는 번호만
    if (!m) continue;
    const areas = (byOrg.get(r[1]) || new Map()).get(m[1]);
    if (!areas || areas.size !== 1) continue;                   // 근거가 없거나 갈리면 그대로
    r[6] = [...areas][0] + '-' + m[1] + '-' + m[2] + m[3];
    r._guess = [...areas][0];
    filled++;
  }
  return filled;
}

// ── 수기 보강 자료 얹기 ───────────────────────────────────────────
// supplement.json 에 사진·현장 확인으로 얻은 성명·업무를 담아 둔다. 자동수집 자료(data.json)는
// 매일 통째로 덮어써지므로 파일을 따로 두고, 화면을 그릴 때 기관+부서+전화번호가 같은 행을
// 찾아 얹는다. 기본은 관세청 자료가 우선이라 이미 성명이 있으면 보강값을 쓰지 않고,
// 업무도 원본을 지우지 않고 아래에 한 줄 덧붙인다. 다만 묶음에 "우선": "사진" 이 적혀 있으면
// 그 부서는 보강 쪽이 더 최신이라고 보고 이름과 업무를 덮어쓰며, "공석" 에 적은 자리는
// 이름을 지워 부서·업무 행으로 되돌린다.
function applySupplement(rows, sup) {
  // 띄어쓰기·기호만 다른 업무는 덧붙이지 않는다 ("수출 통관" ↔ "수출통관").
  const bare = t => String(t == null ? '' : t).replace(/[\s·,()\-]/g, '');
  const out = { filled: 0, added: 0, replaced: 0, cleared: 0, skipped: 0 };
  const bundles = (sup && sup['묶음']) || [];
  if (!bundles.length) return out;

  const byKey = new Map();                 // 기관|부서|전화번호 → 행 목록 (한 번호에 여러 행이 있다)
  const sysOf = new Map();                 // 기관 → 수집기 식별자
  for (const r of rows) {
    const k = r[1] + '|' + r[2] + '|' + r[6];
    if (!byKey.has(k)) byKey.set(k, []);
    byKey.get(k).push(r);
    if (!sysOf.has(r[1])) sysOf.set(r[1], r[0]);
  }

  for (const b of bundles) {
    const org = String(b['기관'] || '').trim(), dept = String(b['부서'] || '').trim();
    if (!org || !dept) continue;
    const head = String(b['대표번호'] || '').trim();
    // "우선": "사진" 이면 관세청 자료보다 이 묶음이 최신이라고 보고 이름을 덮어쓴다.
    const wins = /사진|보강|수기/.test(String(b['우선'] || ''));
    const mark = { src: String(b['출처'] || '수기 입력'), at: String(b['확인일'] || (sup && sup.updated) || '') };
    // 내선만 적어도 되게 대표번호를 앞에 붙인다. 전화번호를 통째로 적으면 그것을 쓴다.
    const num = v => formatPhone(!v ? '' : String(v).includes('-') ? v : (head ? head + '-' + v : v));
    const at = p => byKey.get(org + '|' + dept + '|' + p) || [];

    // 1) 사진에 공석으로 적힌 자리 — 자리를 뜬 사람 이름을 지워 부서·업무 행으로 되돌린다.
    //    (번호와 업무는 그대로 두므로 전화번호를 찾는 데는 지장이 없다)
    for (const v of (b['공석'] || [])) {
      const p = num(v);
      if (!p) continue;
      for (const r of at(p)) {
        if (!r[4]) continue;
        r[3] = ''; r[4] = ''; r._sup = mark; r._vacated = true;
        out.cleared++;
      }
    }

    // 2) 명단
    for (const p of (b['명단'] || [])) {
      const name = String(p['성명'] || '').trim();
      if (!name) continue;
      const phone = num(p['전화번호'] || p['내선']);
      if (!phone) continue;
      const rank = String(p['직위'] || '').trim(), job = String(p['업무'] || '').trim();
      const here = at(phone);
      // 이 묶음이 방금 만든 행은 대상에서 뺀다 (같은 번호에 두 사람이 앉는 경우가 있다).
      const mine = here.filter(r => r._supNew);
      const named = here.filter(r => r[4] && !r._supNew);
      const blank = here.filter(r => !r[4] && !r._supNew);

      if (named.some(r => r[4] === name) || mine.some(r => r[4] === name)) { out.skipped++; continue; }

      if (named.length && wins) {            // 자료에 다른 이름이 있는데 사진이 더 최신인 경우
        const r = named[0];
        r[3] = rank || r[3]; r[4] = name;
        if (job) r[5] = job;                 // 사람이 바뀌었으면 적힌 업무도 바뀐 것으로 본다
        r._sup = mark; delete r._supJob;
        out.replaced++;
      } else if (named.length) {             // 관세청이 공개한 이름이 우선
        out.skipped++;
      } else if (blank.length) {
        const r = blank[0];
        r[4] = name;
        if (rank && !r[3]) r[3] = rank;
        if (job && bare(job) !== bare(r[5])) r._supJob = job;
        r._sup = mark;
        out.filled++;
      } else {
        const r = [sysOf.get(org) || '', org, dept, rank, name, job, phone];
        r._sup = mark; r._supNew = true;
        rows.push(r);
        here.push(r);
        byKey.set(org + '|' + dept + '|' + phone, here);
        out.added++;
      }
    }
  }
  return out;
}

// 확인일이 1년 넘게 지난 보강값은 인사이동으로 틀어졌을 수 있어 표시를 흐리게 한다.
function supBadge(mark) {
  const label = '직접입력';
  const d = new Date(mark.at);
  if (isNaN(d.getTime())) return { label: label, cls: '', title: mark.src + '에서 확인한 값입니다 (관세청 자료에는 없는 내용입니다)' };
  const months = Math.round((Date.now() - d.getTime()) / 2592000000);
  if (months >= 12) return { label: label, cls: ' old', title: mark.src + '(' + mark.at + ' 확인) — ' + months + '개월 지나 인사이동으로 바뀌었을 수 있습니다' };
  return { label: label, cls: '', title: mark.src + '(' + mark.at + ' 확인)에서 얻은 값입니다 · 관세청 자료에는 없는 내용입니다' };
}

function highlight(text, terms) {
  if (!text) return '';
  let html = esc(text);
  for (const t of terms) {
    if (!t) continue;
    const re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    html = html.replace(re, m => `<mark>${m}</mark>`);
  }
  return html;
}

function apply() {
  const { type, agency, q, filters } = state;
  const fEntries = Object.entries(filters).filter(([, v]) => v);
  state.list = state.rows.filter(r => {
    if (type === 'p' && !r[4]) return false;
    if (type === 'd' && r[4]) return false;
    if (agency && r[1] !== agency) return false;
    for (const t of q) if (!r._s.includes(t)) return false;
    for (const [c, v] of fEntries) if (!norm(r[c]).includes(v)) return false;
    return true;
  });
  state.shown = PAGE;
  render();
}

function render() {
  const terms = [...state.q, ...Object.values(state.filters)].filter(Boolean);
  const raw = $('q').value.trim().split(/\s+/).filter(Boolean);
  const hl = raw.length ? raw : terms;
  const list = state.list.slice(0, state.shown);
  $('rows').innerHTML = list.map(r => {
    const tel = telOf(r[6]);
    const sb = r._sup && r[4] ? supBadge(r._sup) : null;
    return `<tr>
      <td class="agency">${highlight(r[1], hl)}</td>
      <td class="dept">${r[4] ? '' : '<span class="tag d">부서</span>'}${highlight(r[2], hl)}</td>
      <td class="pos">${highlight(r[3], hl)}</td>
      <td class="name">${highlight(r[4], hl)}${sb ? `<span class="src${sb.cls}" title="${esc(sb.title)}">${sb.label}</span>` : ''}</td>
      <td>${highlight(r[5], hl)}${r._supJob ? `<span class="subjob">직접 입력 · ${highlight(r._supJob, hl)}</span>` : ''}</td>
      <td class="phone"${r._guess ? ` title="원본에 지역번호가 없어 같은 기관의 다른 번호에서 ${r._guess} 로 추정한 값입니다"` : ''}>${!r[6] ? '' : tel ? `<a href="tel:${tel}">${highlight(r[6], hl)}</a>${r._guess ? '<span class="guess">?</span>' : ''}` : highlight(r[6], hl)}</td>
    </tr>`;
  }).join('');
  const total = state.list.length;
  $('count').innerHTML = `<b>${total.toLocaleString()}</b>건${total > state.shown ? ` 중 ${state.shown.toLocaleString()}건 표시` : ''}`;
  $('more').hidden = total <= state.shown;
  $('empty').hidden = total > 0;
  $('empty').textContent = state.rows.length ? '검색 결과가 없습니다.' : '';
}

let timer;
const debounced = () => { clearTimeout(timer); timer = setTimeout(apply, 120); };

$('q').addEventListener('input', e => {
  state.q = e.target.value.split(/\s+/).map(norm).filter(Boolean);
  debounced();
});
document.querySelectorAll('thead input').forEach(inp => inp.addEventListener('input', () => {
  state.filters[inp.dataset.c] = norm(inp.value);
  debounced();
}));
$('type').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#type button').forEach(x => x.classList.toggle('on', x === b));
  state.type = b.dataset.v; apply();
});
$('agency').addEventListener('change', e => { state.agency = e.target.value; apply(); });
$('more').addEventListener('click', () => { state.shown += PAGE; render(); });

Promise.all([
  fetch('data.json?t=' + Date.now()).then(r => r.json()),
  // 보강 파일은 없을 수도 있다. 못 읽어도 자동수집 자료는 그대로 보여준다.
  fetch('supplement.json?t=' + Date.now()).then(r => (r.ok ? r.json() : null)).catch(() => null),
]).then(([d, sup]) => {
  const rows = d.rows.map(r => {
    for (let i = 1; i <= 5; i++) r[i] = unent(r[i] || '');
    r[6] = formatPhone(unent(r[6] || ''));
    return r;
  });
  fillAreaCodes(rows);                                   // 전체를 본 뒤 빠진 지역번호를 채운다
  applySupplement(rows, sup);                            // 수기로 보강한 성명·업무를 얹는다
  state.rows = rows.map(r => Object.assign(r, { _s: norm(r.slice(1).join(' ') + ' ' + (r._supJob || '')) }));
  const agencies = [...new Set(rows.map(r => r[1]))];
  $('agency').insertAdjacentHTML('beforeend', agencies.map(a => `<option>${esc(a)}</option>`).join(''));
  const dt = new Date(d.updated);
  const people = rows.filter(r => r[4]).length;
  $('updated').textContent = `${dt.getFullYear()}.${dt.getMonth() + 1}.${dt.getDate()} 기준 · 직원 ${people.toLocaleString()}명 · 부서·업무 ${(rows.length - people).toLocaleString()}건`;
  apply();
}).catch(() => {
  $('updated').textContent = '데이터를 불러오지 못했습니다.';
  $('empty').hidden = false;
  $('empty').textContent = '데이터 파일(data.json)을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.';
});
</script>
</body>
</html>
